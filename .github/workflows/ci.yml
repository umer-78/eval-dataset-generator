name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/evalgen
          key: evalgen-banking77-bge-small
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # build eval sets from Banking77 logs three ways
      - run: python -m evalgen bench
