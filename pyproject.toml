[project]
name = "eval-dataset-generator"
version = "0.1.0"
description = "Turn production LLM logs into a redacted, clustered, failure-rich and still unbiased evaluation set"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scikit-learn==1.9.1", "onnxruntime==1.30.0", "tokenizers==0.23.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evalgen"]
